name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline tests
        run: python -m unittest discover -s test -v
      - name: Check local installation without model requests
        run: python -m finresearch doctor
      - name: Check publication boundary
        run: |
          python scripts/check_publication.py
          python scripts/check_publication.py --all-history
