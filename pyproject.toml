[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-system"
version = "0.1.0"
description = "Financial research workbench with FinAgent evidence and workflow integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.23.0", "pypdf==5.0.1", "PyMuPDF==1.24.11", "openpyxl==3.1.5", "Pillow==10.4.0", "pydantic==2.13.5", "httpx==0.28.1"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
finresearch = "finresearch.cli:main"
finagent = "finagent.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
documents = ["pdfplumber==0.11.9"]
ocr = ["pytesseract==0.3.13"]

[tool.setuptools.packages.find]
# Run from a full source checkout, or use an editable install of that checkout.
# A standalone wheel does not include resources/, web/, or config.json.
include = ["finresearch*", "finagent*"]

[tool.setuptools.package-data]
finagent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
